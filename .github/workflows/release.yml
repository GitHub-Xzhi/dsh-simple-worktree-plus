name: Release

# 每次推送 main 都先检查「Git 标签 + npm 包」的真实状态。
# 已同时存在时只做轻量检查后跳过，因此不需要靠修改版本号来重试发布。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  # 创建 Git 标签与 GitHub Release 需要写入仓库内容的权限。
  contents: write
  # npm Trusted Publishing 使用 GitHub OIDC 令牌，需要这个权限。
  id-token: write

concurrency:
  # 同一时间只允许一个发布流程，避免两个运行同时抢占同一个 npm 版本或标签。
  group: release
  cancel-in-progress: false

jobs:
  inspect-state:
    name: 检查发布状态
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.state.outputs.version }}
      tag: ${{ steps.state.outputs.tag }}
      should_release: ${{ steps.state.outputs.should_release }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 检查 Git 标签和 npm 版本
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          if ! node -e "const v=process.argv[1]; if (!/^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$/.test(v)) process.exit(1)" "$version"; then
            echo "package.json version must be a stable SemVer (x.y.z): $version" >&2
            exit 1
          fi

          package="$(node -p "require('./package.json').name")"
          tag="v$version"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          # 先查询 Git 标签。只有明确收到 404 才视为“标签不存在”，网络/权限错误会直接失败。
          if tag_sha="$(gh api "repos/$REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>"$temp_dir/tag-error")"; then
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "$tag already points to $tag_sha instead of $GITHUB_SHA." >&2
              exit 1
            fi
            tag_exists=true
          elif grep -q 'HTTP 404' "$temp_dir/tag-error"; then
            tag_exists=false
          else
            cat "$temp_dir/tag-error" >&2
            exit 1
          fi

          # 再查询 npm。npm 返回 404 才表示未发布，避免把网络故障误判为“可以发布”。
          if npm view "$package@$version" version --json >"$temp_dir/npm-version" 2>"$temp_dir/npm-error"; then
            npm_exists=true
          elif grep -qE 'E404|404 Not Found' "$temp_dir/npm-error"; then
            npm_exists=false
          else
            cat "$temp_dir/npm-error" >&2
            exit 1
          fi

          # 两者同时存在说明该版本已经完成发布；其他组合都需要进入发布流程：
          # - 没有标签：补齐标签与 Release，必要时也发布 npm；
          # - 有标签但 npm 不存在：先发布 npm，最后补齐 GitHub Release。
          should_release=true
          if [[ "$tag_exists" == true && "$npm_exists" == true ]]; then
            should_release=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "version=$version, tag_exists=$tag_exists, npm_exists=$npm_exists, should_release=$should_release"

  release:
    name: 发布 npm 包和 GitHub Release
    needs: inspect-state
    if: needs.inspect-state.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 设置 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: 安装兼容 Trusted Publishing 的 npm
        run: npm install --global npm@11.19.0

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 完整验证
        run: pnpm test

      - name: 打包发布产物
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          json="$(npm pack --json)"
          filename="$(node -e "const p=JSON.parse(process.argv[1]); process.stdout.write(p[0].filename)" "$json")"
          integrity="$(node -e "const p=JSON.parse(process.argv[1]); process.stdout.write(p[0].integrity)" "$json")"
          test -f "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      - name: 重新确认 Git 标签状态
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.inspect-state.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if tag_sha="$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.sha' 2>"$error_file")"; then
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "$TAG already points to $tag_sha instead of $GITHUB_SHA." >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' "$error_file"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            exit 1
          fi

      - name: 重新确认 npm 包状态
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          package="$(node -p "require('./package.json').name")"
          version="${{ needs.inspect-state.outputs.version }}"
          local_integrity="${{ steps.pack.outputs.integrity }}"
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT

          if remote_integrity="$(npm view "$package@$version" dist.integrity --json 2>"$error_file" | node -e "let data=''; process.stdin.on('data', c => data += c); process.stdin.on('end', () => { const value = JSON.parse(data || 'null'); if (typeof value !== 'string') process.exit(1); process.stdout.write(value) })")"; then
            if [[ "$remote_integrity" != "$local_integrity" ]]; then
              echo "npm already contains $package@$version, but its integrity differs from this commit." >&2
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -qE 'E404|404 Not Found' "$error_file"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            exit 1
          fi

      - name: 决定本次发布动作
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          tag_exists="${{ steps.tag.outputs.exists }}"
          npm_published="${{ steps.registry.outputs.published }}"

          # 防御并发窗口：如果预检之后两者都已存在，则不再创建任何发布资源。
          if [[ "$tag_exists" == true && "$npm_published" == true ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "npm_publish=false" >> "$GITHUB_OUTPUT"
            echo "tag_create=false" >> "$GITHUB_OUTPUT"
            echo "release_create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "npm_publish=$([[ "$npm_published" == false ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tag_create=$([[ "$tag_exists" == false ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # 只要尚未完整发布，就在 npm 操作和标签操作之后创建/更新 GitHub Release。
          echo "release_create=true" >> "$GITHUB_OUTPUT"

      - name: 发布到 npm
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.npm_publish == 'true'
        run: npm publish "./${{ steps.pack.outputs.filename }}" --access public --provenance

      - name: 创建 Git 标签
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.tag_create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.inspect-state.outputs.tag }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$GITHUB_SHA" >/dev/null

      - name: 创建或更新 GitHub Release
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.release_create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.inspect-state.outputs.tag }}
          VERSION: ${{ needs.inspect-state.outputs.version }}
          ARTIFACT: ${{ steps.pack.outputs.filename }}
        shell: bash
        run: |
          set -euo pipefail
          # 只有 npm 发布成功（或已确认完整性一致）后才会执行到这里。
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "dsh-simple-worktree $VERSION" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$TAG" "$ARTIFACT" --clobber
